# Render service definition (optional). When connecting the repo in Render you can
# import this file to preconfigure the service. Replace placeholders in the
# Render dashboard after import; do NOT store secrets here.
services:
  - type: web
    name: sentineltrace-backend
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_USERS_JSON
        sync: false
